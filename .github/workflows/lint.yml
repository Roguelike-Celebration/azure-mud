name: Linting and Validation Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Show tool versions
        run: |
          for cmd in node npm; do echo -n "${cmd}: "; ${cmd} --version; done

      - name: NPM install - frontend
        run: npm ci

      - name: NPM install - backend
        run: cd server && npm ci

      - name: Build frontend
        run: npm run build

      # This produces compiled.json, which needs to exist for lint-rooms to work
      - name: Build backend
        run: cd server && npm run build

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Lint bash
        if: ${{ !cancelled() }}
        run: npm run lint-bash

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # - name: Lint rooms
      #   run: npm run lint-rooms

  check-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Show tool versions
        run: |
          for cmd in node npm; do echo -n "${cmd}: "; ${cmd} --version; done

      - name: Regenerate frontend lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Regenerate backend lockfile
        run: cd server && npm install --package-lock-only --ignore-scripts

      - name: Compare lockfiles to git
        run: git diff --exit-code package-lock.json server/package-lock.json
