name: Linting and Validation Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci

      # This produces compiled.json, which needs to exist for lint-rooms to work
      - name: server build
        run: |
          cd server
          npm ci
          npm run build

      - name: build
        run: npm run build

      - name: lint
        run: npm run lint

      # - name: lintRooms
      #   run: npm run lint-rooms

      - name: typecheck
        run: cd server && npm ci && cd ..; npm run typecheck
