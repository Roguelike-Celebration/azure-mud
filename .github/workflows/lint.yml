name: Linting and Validation Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: show tool versions
        run: |
          for cmd in node npm; do echo "${cmd}:"; ${cmd} --version; done

      - name: npm setup frontend
        run: npm ci

      - name: npm setup server
        run: cd server && npm ci

      # This produces compiled.json, which needs to exist for lint-rooms to work
      - name: build server
        run: cd server && npm run build

      - name: build frontend
        run: npm run build

      - name: lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # - name: lintRooms
      #   run: npm run lint-rooms

  check-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: show tool versions
        run: |
          for cmd in node npm; do echo -n "${cmd}: "; ${cmd} --version; done

      - name: regenerate frontend lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: regenerate backend lockfile
        run: cd server && npm install --package-lock-only --ignore-scripts

      - name: compare lockfiles to git
        run: git diff --exit-code package-lock.json server/package-lock.json
